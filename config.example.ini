# Настройки GTA 6 News Digest.
# Скопируй этот файл в config.ini и поменяй под себя.
# config.ini не попадает в GitHub (там токен бота).

[general]
# Раз во сколько минут собирать новые посты. Меньше 15 не ставь — Reddit может заблокировать.
poll_minutes = 20
# Через сколько дней удалять старые посты (обещали Reddit: 30)
retention_days = 30
# Во сколько присылать ежедневный дайджест (локальное время компьютера)
digest_time = 10:00
# Как парсер представляется сайтам. Когда будет аккаунт приложения, впиши его ник.
user_agent = gta6-digest/0.1 (personal non-commercial project)
db_path = data/gta6.db
log_path = data/parser.log

[telegram]
enabled = false
# Токен от @BotFather
token =
# Узнать: напиши боту что угодно, потом python3 main.py chat-id
chat_id =
# Сразу присылать официальные новости и подтвердившиеся слухи
instant_alerts = true

[reddit]
enabled = true
subreddit = GTA6
# Какие списки постов брать: new, hot, top, rising
listings = new, hot

[digest]
# Сколько историй показывать в каждой категории
max_per_category = 5
show_memes = false

[classifier]
# Ссылки на эти сайты = официальная информация
official_domains = rockstargames.com, take2games.com
# Ники/названия инсайдеров через запятую (ищутся в тексте постов).
# Посты с упоминанием получат статус "инсайдер" вместо "слух".
insiders =

[news]
# Из новостных лент берём только статьи, где встречаются эти слова
keywords = gta 6, gta vi, gta6, grand theft auto 6, grand theft auto vi

# Новостные ленты. Добавить свою: новая секция [news:Название] с url.
# Если лента выдаёт ошибки в логе — поставь enabled = false.
[news:Eurogamer]
url = https://www.eurogamer.net/feed
enabled = true

[news:PC Gamer]
url = https://www.pcgamer.com/rss/
enabled = true

[news:GamesRadar]
url = https://www.gamesradar.com/rss/
enabled = true

[news:VG247]
url = https://www.vg247.com/feed
enabled = true

[news:IGN]
url = https://feeds.feedburner.com/ign/games-all
enabled = true
