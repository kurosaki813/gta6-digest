# GTA 6 News Digest settings.
# Copy this file to config.ini and adjust it.
# config.ini is git-ignored: it holds your bot token and Reddit credentials.

[general]
# How often to collect new posts, in minutes (minimum 15).
poll_minutes = 20
# Delete stored posts older than this many days (capped at 30).
retention_days = 14
# When to send the daily digest (local time of this computer).
digest_time = 10:00
# How the parser identifies itself. Replace <username> with the app's Reddit account.
user_agent = gta6-digest/0.2 by u/<username>
db_path = data/gta6.db
log_path = data/parser.log

[telegram]
enabled = false
# Token from @BotFather
token =
# Send any message to your bot, then run: python3 main.py chat-id
chat_id =
# Send official news and confirmed rumors immediately
instant_alerts = true

[reddit]
enabled = true
subreddit = GTA6
# Which listings to read: new, hot, top, rising
listings = new, hot
# rss = no key needed (until Reddit retires RSS on 2026-11-13)
# api = official Data API, after access is approved
mode = rss
# Credentials of your "script" app from https://www.reddit.com/prefs/apps (API mode only)
client_id =
client_secret =
username =
password =
# How often to re-check stored posts for deletions/removals, in hours (API mode only)
deletion_sync_hours = 6

[digest]
# Stories shown per category
max_per_category = 5
show_memes = false

[classifier]
# Links to these domains mean official information
official_domains = rockstargames.com, take2games.com
# Comma-separated insider names to look for in post text.
# Matching posts get the "insider" status instead of "rumor".
insiders =

[news]
# Only news articles containing one of these words are kept
keywords = gta 6, gta vi, gta6, grand theft auto 6, grand theft auto vi

# News feeds. To add one, create a [news:Name] section with a url.
# If a feed keeps failing in the log, set enabled = false.
[news:Eurogamer]
url = https://www.eurogamer.net/feed
enabled = true

[news:PC Gamer]
url = https://www.pcgamer.com/rss/
enabled = true

[news:GamesRadar]
url = https://www.gamesradar.com/rss/
enabled = true

[news:VG247]
url = https://www.vg247.com/feed
enabled = true

[news:IGN]
url = https://feeds.feedburner.com/ign/games-all
enabled = true
